# Build args: nginx php embed manticore
# This is common file for all environments
# You can use compose.yml in each container for variables extensions
x-dev-networks: &default_dev_networks
  networks:
    - default

x-production-networks: &default_production_networks
  network_mode: host

x-dev-restart: &default_dev_restart
  restart: 'no'

x-production-restart: &default_production_restart
  restart: always

networks:
  default:
    driver: bridge

volumes:
  env-storage:
  manticore-storage:
  huggingface-storage:
  tmp-storage:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=200m


services:

  embed:
    build:
      dockerfile: ./docker/images/Dockerfile-embed
      context: ..
    container_name: manticore-image-search.embed
    image: manticore-image-search/embed:1.0.1
    labels:
      - role=embed
    working_dir: /src
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - huggingface-storage:/root/.cache:rw
    ports:
      - 8000:8000
    <<: [*default_dev_networks,*default_dev_restart]
    hostname: embed

  nginx:
    build:
      dockerfile: ./docker/images/Dockerfile-nginx
      context: ..
    container_name: manticore-image-search.nginx
    image: manticore-image-search/nginx:1.0.4
    labels:
      - role=nginx
    working_dir: /src
    expose:
      - '80'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_NICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      - PROJECT=manticore-image-search
    volumes:
      - env-storage:/src/env
    ports:
      - '8100:80'
    <<: [*default_dev_networks,*default_dev_restart]
    hostname: nginx

  php:
    build:
      dockerfile: ./docker/images/Dockerfile-php
      context: ..
    container_name: manticore-image-search.php
    image: manticore-image-search/php:1.0.3
    labels:
      - role=php
    working_dir: /src
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    environment:
      - APP_ENV=dev
    volumes:
      - env-storage:/src/env:rw
    <<: [*default_dev_networks,*default_dev_restart]
    hostname: php

  manticore:
    container_name: manticore-image-search.manticore
    image: manticoresearch/manticore:dev-6.3.7-626b327
    labels:
      - role=manticore
    restart: "always"
    environment:
      - EXTRA=1
    volumes:
      - manticore-storage:/var/lib/manticore:rw
      - docker/containers/manticore/backup:/docker-entrypoint-initdb.d:rw
    <<: [*default_dev_networks]
    hostname: manticore
